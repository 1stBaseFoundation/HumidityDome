name: tick

on:
  schedule:
    # Every hour, UTC. GitHub may delay scheduled runs by a few minutes, and on
    # low-activity repos it can drop scheduled runs entirely — a 1-hour external
    # cron (cron-job.org) is the reliable primary trigger.
    # Editing this file forces GitHub to re-register the schedule if it stops firing.
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger HumidityDome tick
        run: |
          curl -sS -X POST "$SPRITE_URL/tick" \
            -H "Authorization: Bearer $SPRITES_TOKEN" \
            -H "Content-Type: application/json" \
            --retry 2 --retry-delay 5 --retry-all-errors --max-time 90 \
            --fail-with-body
        env:
          SPRITE_URL: ${{ secrets.SPRITE_URL }}
          SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}